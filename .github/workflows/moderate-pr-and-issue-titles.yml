name: Moderate PR and issue titles

on:
  schedule:
    # GitHub schedules are best-effort and can be delayed; every-minute cron is
    # not a real-time guarantee.
    - cron: "*/1 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, reopened, edited]
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out banned terms
        uses: actions/checkout@v4

      - name: Close matching open PRs and issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const moderate = require("./scripts/moderate-titles.js");

            const terms = fs.readFileSync("banned-terms.txt", "utf8");
            await moderate({
              github,
              context,
              core,
              terms,
            });
